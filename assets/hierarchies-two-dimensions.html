<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Dimensions of International Hierarchy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --foreground: #2c3e50;
      --muted: #6c7b86;
      --border: #d0d7de;
      --land: #e8edf1;
      --land-empty: #f5f7f8;
      --point: #8799a5;
      --accent: #1d6fa5;
      --accent-dark: #15547d;
      --font-sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-heading: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div id="how-two-hierarchies">
  <style>
    #how-two-hierarchies {
      position: relative;
      width: 100%;
      color: var(--foreground);
      font-family: var(--font-sans);
    }
    #how-two-hierarchies * { box-sizing: border-box; }
    #how-two-hierarchies .how-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 270px);
      align-items: end;
      gap: 20px;
      margin-bottom: 18px;
    }
    #how-two-hierarchies h2 {
      margin: 0 0 6px;
      font-family: var(--font-heading);
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 500;
      line-height: 1.03;
      letter-spacing: -0.035em;
    }
    #how-two-hierarchies .how-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    #how-two-hierarchies .how-find {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #how-two-hierarchies .how-find input {
      width: 100%;
      padding: 7px 0 6px;
      color: var(--foreground);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      outline: none;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
    }
    #how-two-hierarchies .how-find input:focus { border-bottom-color: var(--accent); }
    #how-two-hierarchies .how-views {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
      gap: 24px;
      align-items: start;
    }
    #how-two-hierarchies .how-panel { min-width: 0; }
    #how-two-hierarchies .how-panel-head {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #how-two-hierarchies .how-canvas {
      position: relative;
      width: 100%;
    }
    #how-two-hierarchies svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #how-two-hierarchies .axis text,
    #how-two-hierarchies svg text {
      fill: var(--foreground);
      font-size: 11px;
    }
    #how-two-hierarchies .axis path,
    #how-two-hierarchies .axis line { stroke: var(--border); }
    #how-two-hierarchies .country {
      vector-effect: non-scaling-stroke;
      transition: fill 90ms ease, stroke 90ms ease;
    }
    #how-two-hierarchies .country[data-has-score="true"] { cursor: pointer; }
    #how-two-hierarchies .country.is-active {
      fill: var(--accent);
      stroke: var(--accent-dark);
      stroke-width: 1.25;
    }
    #how-two-hierarchies .dot {
      cursor: pointer;
      transition: r 90ms ease, opacity 90ms ease, fill 90ms ease;
    }
    #how-two-hierarchies .dot.is-active {
      fill: var(--accent);
      opacity: 1;
      stroke: #ffffff;
      stroke-width: 1.8;
    }
    #how-two-hierarchies .how-tooltip {
      position: absolute;
      z-index: 5;
      max-width: 240px;
      padding: 8px 10px;
      color: var(--foreground);
      background: #ffffff;
      border: 1px solid var(--border);
      opacity: 0;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 3px 12px rgba(30, 48, 60, .08);
    }
    #how-two-hierarchies .how-tooltip strong {
      display: block;
      margin-bottom: 2px;
      font-weight: 500;
    }
    #how-two-hierarchies .how-selected {
      display: flex;
      align-items: baseline;
      gap: 12px 20px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding: 11px 0 9px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    #how-two-hierarchies .how-selected strong {
      min-width: 150px;
      font-size: 16px;
      font-weight: 500;
    }
    #how-two-hierarchies .how-selected span { color: var(--muted); }
    #how-two-hierarchies .how-selected b {
      color: var(--foreground);
      font-weight: 500;
    }
    #how-two-hierarchies .how-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    @media (max-width: 720px) {
      #how-two-hierarchies .how-head { grid-template-columns: 1fr; gap: 10px; }
      #how-two-hierarchies .how-views { grid-template-columns: 1fr; gap: 16px; }
      #how-two-hierarchies .how-map-panel { max-width: 620px; }
      #how-two-hierarchies .how-selected { gap: 5px 14px; }
      #how-two-hierarchies .how-selected strong { flex-basis: 100%; }
    }
  </style>

  <div class="how-head">
    <div>
      <h2>Two Dimensions of International Hierarchy</h2>
      <p class="how-subtitle">Move across the map or the chart to see how the same country occupies two different positions.</p>
    </div>
    <label class="how-find">Find a country
      <input type="text" list="how-country-list" value="United States" aria-label="Find a country">
      <datalist id="how-country-list"></datalist>
    </label>
  </div>

  <div class="how-views">
    <section class="how-panel how-map-panel" aria-labelledby="how-map-heading">
      <h3 class="how-panel-head" id="how-map-heading">World map</h3>
      <div class="how-canvas how-map">
        <svg role="img" aria-labelledby="how-map-title how-map-desc">
          <title id="how-map-title">Map of countries in the hierarchy</title>
          <desc id="how-map-desc">Hover over or select a country to locate its position in the chart.</desc>
        </svg>
      </div>
    </section>
    <section class="how-panel how-scatter-panel" aria-labelledby="how-scatter-heading">
      <h3 class="how-panel-head" id="how-scatter-heading">Country positions</h3>
      <div class="how-canvas how-scatter">
        <svg role="img" aria-labelledby="how-scatter-title how-scatter-desc">
          <title id="how-scatter-title">Country positions in two dimensions of international hierarchy</title>
          <desc id="how-scatter-desc">Cross-border incorporation is shown from left to right. Formal recognition is shown from bottom to top.</desc>
        </svg>
      </div>
    </section>
  </div>

  <div class="how-selected" aria-live="polite"></div>
  <div class="how-note">191 countries. Scores are standardized. Hover or click a country or point.</div>
  <div class="how-tooltip" role="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module">
    import world from './countries-50m.mjs';

    const root = document.getElementById('how-two-hierarchies');
    const data = JSON.parse(document.getElementById('how-two-hierarchies-data').textContent);
    const byId = new Map(data.map(d => [d.id, d]));
    const mapAlias = new Map([['SDS', 'SSD']]);
    const features = topojson.feature(world, world.objects.features).features
      .filter(d => d.properties.id !== 'ATA')
      .map(d => {
        d.dataId = mapAlias.get(d.properties.id) || d.properties.id;
        return d;
      });
    const mapCanvas = root.querySelector('.how-map');
    const scatterCanvas = root.querySelector('.how-scatter');
    const mapSvg = d3.select(root.querySelector('.how-map svg'));
    const scatterSvg = d3.select(root.querySelector('.how-scatter svg'));
    const selectedLine = root.querySelector('.how-selected');
    const tooltip = root.querySelector('.how-tooltip');
    const input = root.querySelector('input');
    const datalist = root.querySelector('datalist');
    let selected = byId.get('USA');
    let hovered = null;
    let pointPositions = new Map();

    data.slice().sort((a, b) => d3.ascending(a.name, b.name)).forEach(d => {
      const option = document.createElement('option');
      option.value = d.name;
      option.label = d.id;
      datalist.appendChild(option);
    });

    function activeCountry() { return hovered || selected; }

    function updateReadout() {
      const d = activeCountry();
      selectedLine.innerHTML = `<strong>${d.name}</strong><span>Formal recognition <b>#${d.fr}</b> of ${data.length}</span><span>Cross-border incorporation <b>#${d.cr}</b> of ${data.length}</span>`;
    }

    function updateActiveMarks() {
      const active = activeCountry();
      mapSvg.selectAll('.country')
        .classed('is-active', d => d.dataId === active.id)
        .each(function(d) {
          if (d.dataId === active.id) this.parentNode.appendChild(this);
        });
      scatterSvg.selectAll('.dot')
        .classed('is-active', d => d.id === active.id)
        .attr('r', d => d.id === active.id ? 6.5 : 3.2)
        .each(function(d) {
          if (d.id === active.id) this.parentNode.appendChild(this);
        });
      const pos = pointPositions.get(active.id);
      const labelLeft = pos && pos[0] > pos[2] - 110;
      scatterSvg.select('.active-label')
        .attr('x', pos ? pos[0] + (labelLeft ? -9 : 9) : 0)
        .attr('y', pos ? pos[1] + (pos[1] < 35 ? 16 : -8) : 0)
        .attr('text-anchor', labelLeft ? 'end' : 'start')
        .text(active.name)
        .style('display', pos ? null : 'none');
      updateReadout();
    }

    function showTooltip(event, d) {
      const bounds = root.getBoundingClientRect();
      tooltip.innerHTML = `<strong>${d.name}</strong>Formal recognition: #${d.fr}<br>Cross-border incorporation: #${d.cr}`;
      tooltip.style.opacity = '1';
      const left = Math.min(bounds.width - tooltip.offsetWidth - 6, event.clientX - bounds.left + 12);
      const top = Math.max(4, event.clientY - bounds.top - tooltip.offsetHeight - 12);
      tooltip.style.left = `${Math.max(4, left)}px`;
      tooltip.style.top = `${top}px`;
    }

    function hideTooltip() { tooltip.style.opacity = '0'; }

    function enterCountry(event, d) {
      hovered = d;
      updateActiveMarks();
      showTooltip(event, d);
    }

    function moveCountry(event, d) { showTooltip(event, d); }

    function leaveCountry() {
      hovered = null;
      hideTooltip();
      updateActiveMarks();
    }

    function chooseCountry(d) {
      selected = d;
      input.value = d.name;
      hovered = null;
      hideTooltip();
      updateActiveMarks();
    }

    function drawMap() {
      const width = Math.max(300, mapCanvas.getBoundingClientRect().width || 430);
      const height = Math.max(245, Math.min(410, width * .68));
      const featureCollection = {type: 'FeatureCollection', features};
      const projection = d3.geoNaturalEarth1().fitExtent([[4, 8], [width - 4, height - 8]], featureCollection);
      const path = d3.geoPath(projection);

      mapSvg.attr('viewBox', `0 0 ${width} ${height}`);
      mapSvg.selectAll('g').remove();

      const layer = mapSvg.append('g');
      layer.selectAll('path')
        .data(features)
        .join('path')
        .attr('class', 'country')
        .attr('data-id', d => d.dataId)
        .attr('data-has-score', d => byId.has(d.dataId) ? 'true' : 'false')
        .attr('d', path)
        .attr('fill', d => byId.has(d.dataId) ? 'var(--land)' : 'var(--land-empty)')
        .attr('stroke', '#ffffff')
        .attr('stroke-width', .55)
        .on('pointerenter', (event, feature) => {
          const d = byId.get(feature.dataId);
          if (d) enterCountry(event, d);
        })
        .on('pointermove', (event, feature) => {
          const d = byId.get(feature.dataId);
          if (d) moveCountry(event, d);
        })
        .on('pointerleave', (event, feature) => {
          if (byId.has(feature.dataId)) leaveCountry();
        })
        .on('click', (event, feature) => {
          const d = byId.get(feature.dataId);
          if (d) chooseCountry(d);
        });
    }

    function drawScatter() {
      const width = Math.max(300, scatterCanvas.getBoundingClientRect().width || 500);
      const compact = width < 420;
      const height = compact ? 390 : Math.max(320, Math.min(410, width * .78));
      const margin = compact
        ? {top: 20, right: 16, bottom: 70, left: 57}
        : {top: 20, right: 24, bottom: 68, left: 62};
      const xExtent = d3.extent(data, d => d.c);
      const yExtent = d3.extent(data, d => d.f);
      const xPad = (xExtent[1] - xExtent[0]) * .07;
      const yPad = (yExtent[1] - yExtent[0]) * .07;
      const x = d3.scaleLinear()
        .domain([xExtent[0] - xPad, xExtent[1] + xPad])
        .range([margin.left, width - margin.right]);
      const y = d3.scaleLinear()
        .domain([yExtent[0] - yPad, yExtent[1] + yPad])
        .range([height - margin.bottom, margin.top]);
      const xTicks = compact ? 4 : 5;
      const yTicks = compact ? 4 : 5;

      pointPositions = new Map(data.map(d => [d.id, [x(d.c), y(d.f), width]]));
      scatterSvg.attr('viewBox', `0 0 ${width} ${height}`);
      scatterSvg.selectAll('g, circle, text').remove();

      const grid = scatterSvg.append('g');
      grid.selectAll('.x-grid').data(x.ticks(xTicks)).join('line')
        .attr('x1', d => x(d)).attr('x2', d => x(d))
        .attr('y1', margin.top).attr('y2', height - margin.bottom)
        .attr('stroke', 'var(--border)').attr('stroke-opacity', .58)
        .attr('stroke-dasharray', d => Math.abs(d) < 1e-8 ? '4 4' : '2 7');
      grid.selectAll('.y-grid').data(y.ticks(yTicks)).join('line')
        .attr('x1', margin.left).attr('x2', width - margin.right)
        .attr('y1', d => y(d)).attr('y2', d => y(d))
        .attr('stroke', 'var(--border)').attr('stroke-opacity', .58)
        .attr('stroke-dasharray', d => Math.abs(d) < 1e-8 ? '4 4' : '2 7');

      scatterSvg.append('g').attr('class', 'axis')
        .attr('transform', `translate(0,${height - margin.bottom})`)
        .call(d3.axisBottom(x).ticks(xTicks).tickSizeOuter(0));
      scatterSvg.append('g').attr('class', 'axis')
        .attr('transform', `translate(${margin.left},0)`)
        .call(d3.axisLeft(y).ticks(yTicks).tickSizeOuter(0));

      scatterSvg.append('text')
        .attr('x', margin.left + (width - margin.left - margin.right) / 2)
        .attr('y', height - 18)
        .attr('text-anchor', 'middle')
        .style('font-size', '12px')
        .style('font-weight', '500')
        .text('Cross-border incorporation');
      scatterSvg.append('text')
        .attr('transform', 'rotate(-90)')
        .attr('x', -(margin.top + (height - margin.top - margin.bottom) / 2))
        .attr('y', 15)
        .attr('text-anchor', 'middle')
        .style('font-size', '12px')
        .style('font-weight', '500')
        .text('Formal recognition');

      scatterSvg.append('g').selectAll('circle')
        .data(data)
        .join('circle')
        .attr('class', 'dot')
        .attr('data-id', d => d.id)
        .attr('cx', d => x(d.c))
        .attr('cy', d => y(d.f))
        .attr('r', 3.2)
        .attr('fill', 'var(--point)')
        .attr('opacity', .55)
        .on('pointerenter', enterCountry)
        .on('pointermove', moveCountry)
        .on('pointerleave', leaveCountry)
        .on('click', (event, d) => chooseCountry(d));

      scatterSvg.append('text')
        .attr('class', 'active-label')
        .style('font-size', '12px')
        .style('font-weight', '500')
        .style('paint-order', 'stroke')
        .style('stroke', '#ffffff')
        .style('stroke-width', '4px')
        .style('stroke-linejoin', 'round');
    }

    function draw() {
      drawMap();
      drawScatter();
      updateActiveMarks();
    }

    function resolveInput() {
      const query = input.value.trim().toLowerCase();
      const match = data.find(d => d.name.toLowerCase() === query || d.id.toLowerCase() === query);
      if (match) chooseCountry(match);
    }

    input.addEventListener('change', resolveInput);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') resolveInput();
    });

    const observer = new ResizeObserver(draw);
    observer.observe(root);
    draw();
  </script>
</div>
