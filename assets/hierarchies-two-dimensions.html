<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Dimensions of International Hierarchy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --foreground: #2c3e50;
      --border: #d0d7de;
      --popover: #ffffff;
      --popover-foreground: #2c3e50;
      --viz-series-1: #1d6fa5;
      --font-sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-heading: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div id="how-two-hierarchies">
  <style>
    #how-two-hierarchies {
      color: var(--foreground);
      font-family: var(--font-sans);
      width: 100%;
    }
    #how-two-hierarchies .how-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 270px);
      align-items: end;
      gap: 20px;
      margin-bottom: 12px;
    }
    #how-two-hierarchies h2 {
      font-family: var(--font-heading);
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1.03;
      letter-spacing: -0.035em;
      margin: 0 0 6px;
      font-weight: 500;
    }
    #how-two-hierarchies .how-subtitle {
      margin: 0;
      color: color-mix(in srgb, var(--foreground) 68%, transparent);
      font-size: 13px;
      line-height: 1.35;
    }
    #how-two-hierarchies .how-find {
      display: grid;
      gap: 5px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--foreground) 66%, transparent);
    }
    #how-two-hierarchies .how-find input {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      color: var(--foreground);
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 7px 0 6px;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      outline: none;
    }
    #how-two-hierarchies .how-find input:focus {
      border-bottom-color: var(--viz-series-1);
    }
    #how-two-hierarchies .how-plot {
      position: relative;
      width: 100%;
      min-height: 430px;
    }
    #how-two-hierarchies svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #how-two-hierarchies .axis text,
    #how-two-hierarchies text {
      fill: var(--foreground);
      font-size: 12px;
    }
    #how-two-hierarchies .axis path,
    #how-two-hierarchies .axis line {
      stroke: var(--border);
    }
    #how-two-hierarchies .how-tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
      background: var(--popover);
      color: var(--popover-foreground);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      max-width: 230px;
    }
    #how-two-hierarchies .how-selected {
      display: flex;
      align-items: baseline;
      gap: 12px 20px;
      flex-wrap: wrap;
      padding: 11px 0 9px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    #how-two-hierarchies .how-selected strong {
      font-size: 16px;
      min-width: 150px;
    }
    #how-two-hierarchies .how-selected span {
      color: color-mix(in srgb, var(--foreground) 72%, transparent);
    }
    #how-two-hierarchies .how-selected b {
      color: var(--foreground);
      font-weight: 500;
    }
    #how-two-hierarchies .how-note {
      margin-top: 8px;
      font-size: 11px;
      color: color-mix(in srgb, var(--foreground) 55%, transparent);
    }
    @media (max-width: 540px) {
      #how-two-hierarchies .how-head { grid-template-columns: 1fr; gap: 10px; }
      #how-two-hierarchies .how-find { max-width: none; }
      #how-two-hierarchies .how-selected { gap: 5px 14px; }
      #how-two-hierarchies .how-selected strong { flex-basis: 100%; }
    }
  </style>

  <div class="how-head">
    <div>
      <h2>Two Dimensions of International Hierarchy</h2>
      <p class="how-subtitle">Formal recognition and cross-border incorporation position states differently in world politics.</p>
    </div>
    <label class="how-find">Find a country
      <input type="text" list="how-country-list" value="United States" aria-label="Find a country">
      <datalist id="how-country-list"></datalist>
    </label>
  </div>
  <div class="how-plot" aria-label="Scatterplot of state positions in two international hierarchies">
    <svg role="img" aria-label="Each point is a state, positioned by cross-border incorporation and formal recognition"></svg>
    <div class="how-tooltip" role="tooltip"></div>
  </div>
  <div class="how-selected" aria-live="polite"></div>
  <div class="how-note">N = 155. Scores are standardized.</div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById('how-two-hierarchies');
      const data = JSON.parse(document.getElementById('how-two-hierarchies-data').textContent);
      const plot = root.querySelector('.how-plot');
      const svg = d3.select(root.querySelector('svg'));
      const tooltip = root.querySelector('.how-tooltip');
      const selectedLine = root.querySelector('.how-selected');
      const input = root.querySelector('input');
      const datalist = root.querySelector('datalist');
      let selected = data.find(d => d.id === 'USA');

      data.slice().sort((a, b) => d3.ascending(a.name, b.name)).forEach(d => {
        const option = document.createElement('option');
        option.value = d.name;
        option.label = d.id;
        datalist.appendChild(option);
      });

      function updateSelectedLine() {
        selectedLine.innerHTML = `<strong>${selected.name}</strong><span>Formal recognition <b>#${selected.fr}</b> of 155</span><span>Cross-border incorporation <b>#${selected.cr}</b> of 155</span>`;
      }

      function draw() {
        const width = Math.max(320, plot.getBoundingClientRect().width || 720);
        const compact = width < 540;
        const height = compact ? 455 : Math.min(620, Math.max(470, width * .61));
        const margin = compact
          ? {top: 28, right: 18, bottom: 72, left: 64}
          : {top: 34, right: 34, bottom: 70, left: 72};
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const xExtent = d3.extent(data, d => d.c);
        const yExtent = d3.extent(data, d => d.f);
        const xPad = (xExtent[1] - xExtent[0]) * .08;
        const yPad = (yExtent[1] - yExtent[0]) * .08;
        const x = d3.scaleLinear().domain([xExtent[0] - xPad, xExtent[1] + xPad]).range([margin.left + 8, width - margin.right - 8]);
        const y = d3.scaleLinear().domain([yExtent[0] - yPad, yExtent[1] + yPad]).range([height - margin.bottom - 8, margin.top + 8]);
        const xTicks = compact ? 4 : 6;
        const yTicks = compact ? 4 : 6;

        svg.attr('viewBox', `0 0 ${width} ${height}`);
        svg.selectAll('*').remove();
        svg.append('rect')
          .attr('data-chart-frame', '')
          .attr('x', margin.left).attr('y', margin.top)
          .attr('width', innerW).attr('height', innerH)
          .attr('fill', 'transparent').attr('stroke', 'var(--border)');

        const grid = svg.append('g');
        grid.selectAll('.x-grid').data(x.ticks(xTicks)).join('line')
          .attr('x1', d => x(d)).attr('x2', d => x(d))
          .attr('y1', margin.top).attr('y2', height - margin.bottom)
          .attr('stroke', 'color-mix(in srgb, var(--border) 58%, transparent)')
          .attr('stroke-dasharray', d => Math.abs(d) < 1e-8 ? '4 4' : '2 7');
        grid.selectAll('.y-grid').data(y.ticks(yTicks)).join('line')
          .attr('x1', margin.left).attr('x2', width - margin.right)
          .attr('y1', d => y(d)).attr('y2', d => y(d))
          .attr('stroke', 'color-mix(in srgb, var(--border) 58%, transparent)')
          .attr('stroke-dasharray', d => Math.abs(d) < 1e-8 ? '4 4' : '2 7');

        svg.append('g').attr('class', 'axis')
          .attr('transform', `translate(0,${height - margin.bottom})`)
          .call(d3.axisBottom(x).ticks(xTicks).tickSizeOuter(0));
        svg.append('g').attr('class', 'axis')
          .attr('transform', `translate(${margin.left},0)`)
          .call(d3.axisLeft(y).ticks(yTicks).tickSizeOuter(0));

        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x')
          .attr('x', margin.left + innerW / 2).attr('y', height - 18)
          .attr('text-anchor', 'middle')
          .text('Cross-border incorporation  ·  closed  ⟶  open');
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y')
          .attr('transform', `translate(18,${margin.top + innerH / 2}) rotate(-90)`)
          .attr('text-anchor', 'middle')
          .text('Formal recognition  ·  marginal  ⟶  central');

        if (!compact) {
          const q = [
            {x: margin.left + 12, y: margin.top + 18, a: 'start', t: 'Recognized, but selectively open'},
            {x: width - margin.right - 12, y: margin.top + 18, a: 'end', t: 'Central in both'},
            {x: margin.left + 12, y: height - margin.bottom - 12, a: 'start', t: 'Peripheral in both'},
            {x: width - margin.right - 12, y: height - margin.bottom - 12, a: 'end', t: 'Open, less formally central'}
          ];
          svg.append('g').selectAll('text').data(q).join('text')
            .attr('x', d => d.x).attr('y', d => d.y).attr('text-anchor', d => d.a)
            .attr('fill', 'color-mix(in srgb, var(--foreground) 46%, transparent)')
            .attr('font-size', 11).text(d => d.t);
        }

        const guides = svg.append('g').attr('pointer-events', 'none');
        guides.append('line').attr('x1', x(selected.c)).attr('x2', x(selected.c))
          .attr('y1', y(selected.f)).attr('y2', height - margin.bottom)
          .attr('stroke', 'var(--viz-series-1)').attr('stroke-dasharray', '3 4');
        guides.append('line').attr('x1', margin.left).attr('x2', x(selected.c))
          .attr('y1', y(selected.f)).attr('y2', y(selected.f))
          .attr('stroke', 'var(--viz-series-1)').attr('stroke-dasharray', '3 4');

        const dots = svg.append('g').selectAll('circle').data(data).join('circle')
          .attr('cx', d => x(d.c)).attr('cy', d => y(d.f))
          .attr('r', d => d.id === selected.id ? 6.5 : 3.6)
          .attr('fill', d => d.id === selected.id ? 'var(--viz-series-1)' : 'var(--foreground)')
          .attr('opacity', d => d.id === selected.id ? 1 : .34)
          .attr('stroke', d => d.id === selected.id ? 'var(--background)' : 'none')
          .attr('stroke-width', 1.5);

        const exemplars = compact ? [selected.id] : ['USA', 'RUS', 'NLD', 'SGP', 'FRA', 'GNQ', selected.id];
        const labelData = data.filter(d => exemplars.includes(d.id));
        svg.append('g').selectAll('text').data(labelData).join('text')
          .attr('x', d => x(d.c) + (d.c > x.domain()[1] - .35 ? -8 : 8))
          .attr('y', d => y(d.f) - 7)
          .attr('text-anchor', d => d.c > x.domain()[1] - .35 ? 'end' : 'start')
          .attr('font-weight', d => d.id === selected.id ? 500 : 400)
          .attr('font-size', 11).text(d => d.id);

        const overlay = svg.append('rect')
          .attr('data-chart-hit', '').attr('data-chart-hover-overlay', 'nearest-point')
          .attr('x', margin.left).attr('y', margin.top)
          .attr('width', innerW).attr('height', innerH)
          .attr('fill', 'transparent').style('cursor', 'crosshair');

        function nearest(event) {
          const [mx, my] = d3.pointer(event, svg.node());
          let best = null;
          let distance = Infinity;
          for (const d of data) {
            const dist = (x(d.c) - mx) ** 2 + (y(d.f) - my) ** 2;
            if (dist < distance) { distance = dist; best = d; }
          }
          return distance <= 32 ** 2 ? best : null;
        }

        overlay.on('pointermove', event => {
          const d = nearest(event);
          if (!d) { tooltip.style.opacity = 0; return; }
          const bounds = plot.getBoundingClientRect();
          const px = Math.min(bounds.width - 180, Math.max(6, event.clientX - bounds.left + 12));
          const py = Math.max(6, event.clientY - bounds.top - 54);
          tooltip.innerHTML = `<strong>${d.name}</strong><br>Formal recognition: #${d.fr}<br>Cross-border incorporation: #${d.cr}`;
          tooltip.style.left = `${px}px`;
          tooltip.style.top = `${py}px`;
          tooltip.style.opacity = 1;
        }).on('pointerleave', () => { tooltip.style.opacity = 0; })
          .on('click', event => {
            const d = nearest(event);
            if (!d) return;
            selected = d;
            input.value = d.name;
            updateSelectedLine();
            draw();
          });

        dots.attr('aria-label', d => `${d.name}: formal rank ${d.fr}, cross-border rank ${d.cr}`);
      }

      function selectFromSearch() {
        const value = input.value.trim().toLowerCase();
        const match = data.find(d => d.name.toLowerCase() === value || d.id.toLowerCase() === value);
        if (!match) return;
        selected = match;
        input.value = match.name;
        updateSelectedLine();
        draw();
      }

      input.addEventListener('change', selectFromSearch);
      input.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        selectFromSearch();
        input.blur();
      });

      updateSelectedLine();
      const observer = new ResizeObserver(draw);
      observer.observe(plot);
      draw();
    })();
  </script>
</div>
</body>
</html>
