    :root {
      color-scheme: light;

      --peer: #8799a5;

      --popover: #ffffff;
      --popover-foreground: #202020;

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;

    #country-position-history-mockup {

      position: relative;

    #country-position-history-mockup * { box-sizing: border-box; }

    #country-position-history-mockup p { margin: 0; }
    #country-position-history-mockup h2 {
      font-family: var(--font-heading);
      font-size: clamp(24px, 3.2vw, 38px);
      line-height: 1.08;
      letter-spacing: -0.025em;
      font-weight: 720;
    }
    #country-position-history-mockup .history-plot { width: 100%; }
    #country-position-history-mockup svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #country-position-history-mockup .plot-frame,
    #country-position-history-mockup .axis path,
    #country-position-history-mockup .axis line {
      stroke: var(--border);
    }
    #country-position-history-mockup .plot-frame { fill: none; }
    #country-position-history-mockup .axis text {
      fill: var(--muted-foreground);
      font-size: 11px;
    }
    #country-position-history-mockup .zero-line {
      stroke: var(--border);
      stroke-dasharray: 3 4;
      opacity: 0.85;
    }
    #country-position-history-mockup .country-line {
      fill: none;
      stroke: var(--peer);
      stroke-width: 0.85;
      opacity: 0.16;
    }
    #country-position-history-mockup .formal-line {
      fill: none;
      stroke: var(--foreground);
      stroke-width: 3.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    #country-position-history-mockup .crossborder-line {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 3.6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    #country-position-history-mockup .formal-point {
      fill: var(--background);
      stroke: var(--foreground);
      stroke-width: 2;
    }
    #country-position-history-mockup .crossborder-point {
      fill: var(--yellow);
      stroke: var(--foreground);
      stroke-width: 1.25;
    }
    #country-position-history-mockup .hit-point { fill: transparent; cursor: crosshair; }
    #country-position-history-mockup .axis-title,
    #country-position-history-mockup .endpoint-label {
      fill: var(--foreground);
    }
    #country-position-history-mockup .axis-title { font-size: 12px; font-weight: 500; }
    #country-position-history-mockup .endpoint-label {
      font-size: 12px;
      font-weight: 500;
      paint-order: stroke;
      stroke: var(--background);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    #country-position-history-mockup .history-tooltip {
      position: absolute;
      z-index: 5;
      display: none;
      max-width: 220px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--popover);
      color: var(--popover-foreground);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--foreground) 14%, transparent);
      pointer-events: none;
      font-size: 12px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
  </style>

            .attr("class", "endpoint-label")
            .attr("x", compact ? endpointX - 9 : endpointX + 11)
            .attr("y", y(item.row[item.measure]) + (item.dy || -8))
            .attr("text-anchor", compact ? "end" : "start")
            .text(item.label);
        });

        const xTicks = compact ? [1, 3, 4, 5] : [1, 2, 3, 4, 5];
        const xAxis = svg.append("g")
          .attr("class", "axis")
          .attr("transform", `translate(0,${innerBottom})`)
          .call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d => periods.get(d)).tickSizeOuter(0));
        xAxis.selectAll("text")
          .attr("transform", `rotate(${compact ? -42 : -30})`)
          .attr("text-anchor", "end")
          .attr("dx", "-0.5em")
          .attr("dy", "0.2em");

        svg.append("g")
          .attr("class", "axis")
          .attr("transform", `translate(${margin.left},0)`)
          .call(d3.axisLeft(y).ticks(compact ? 5 : 6).tickSizeOuter(0));

        svg.append("text")
          .attr("class", "axis-title")
          .attr("data-axis", "x")
          .attr("x", (margin.left + innerRight) / 2)
          .attr("y", height - 8)
          .attr("text-anchor", "middle")
          .text("Historical period");

        svg.append("text")
          .attr("class", "axis-title")
          .attr("data-axis", "y")
          .attr("transform", "rotate(-90)")
          .attr("x", -(margin.top + innerBottom) / 2)
          .attr("y", 13)
          .attr("text-anchor", "middle")
          .text("Relative position (standard deviations)");
      }

      let resizeFrame;
      const redraw = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(draw);
      };
      const observer = new ResizeObserver(redraw);
      observer.observe(plotNode);

      window.addEventListener("message", event => {
        const message = event.data;
        if (event.source !== window.parent || !message || message.type !== "hierarchy-country" || !message.id) return;
        selectedName = message.name || message.id;
        selectedId = byIso.get(message.id) || (grouped.has(message.id) ? message.id : null);
        hideTooltip();
        redraw();
      });

      redraw();
      window.parent.postMessage({ type: "hierarchy-ready" }, "*");
    })();
  </script>
</div>
</body>
</html>
